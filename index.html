<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>بونات الكريدي — محطة الوقود</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5fb;
  --card:#ffffff;
  --ink:#1c2033;
  --muted:#6b7190;
  --brand:#4f46e5;
  --brand2:#7c3aed;
  --grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  --ok:#16a34a;
  --warn:#d97706;
  --danger:#e11d48;
  --line:#e6e8f2;
  --shadow:0 10px 30px rgba(28,32,51,.08);
  --shadow-lg:0 20px 50px rgba(28,32,51,.16);
  --r:16px;
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Arial",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
svg{width:22px;height:22px;flex:none}

/* ---------- Toast ---------- */
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  background:#1c2033;color:#fff;padding:12px 20px;border-radius:999px;
  box-shadow:var(--shadow-lg);z-index:999;font-size:14.5px;max-width:92vw;text-align:center;
  animation:toastIn .25s ease;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- Auth ---------- */
.auth{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:24px;
  background:linear-gradient(160deg,#eef0ff 0%,#f7f5ff 50%,#f4f5fb 100%);
}
.auth-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none}
.b1{width:340px;height:340px;background:#4f46e5;top:-80px;right:-60px}
.b2{width:300px;height:300px;background:#7c3aed;bottom:-90px;left:-70px}
.auth-card{
  position:relative;width:100%;max-width:420px;background:var(--card);
  border-radius:24px;box-shadow:var(--shadow-lg);padding:34px 28px 28px;text-align:center;
}
.auth-logo{
  width:74px;height:74px;margin:0 auto 14px;border-radius:22px;background:var(--grad);
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(79,70,229,.35);
}
.auth-logo svg{width:38px;height:38px}
.auth-card h1{margin:0 0 6px;font-size:24px}
.auth-card .sub{margin:0 0 22px;color:var(--muted);font-size:14px}

/* ---------- Forms ---------- */
.form{text-align:right}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:#fbfbfe;outline:none;transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12);background:#fff;
}
.field textarea{min-height:78px;resize:vertical}
.inputrow{display:flex;gap:8px;align-items:stretch}
.inputrow input{flex:1}
.form-error{color:var(--danger);font-size:13.5px;margin:0 0 12px}
.setup-title{font-weight:700;margin-bottom:14px;font-size:16px;text-align:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:12px;font-size:15px;font-weight:700;transition:transform .1s, filter .15s, background .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn.ghost:hover{background:#f6f7fc}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:10px}
.link-btn{
  display:block;width:100%;margin-top:14px;color:var(--brand);font-weight:700;font-size:14px;
  padding:8px;border-radius:10px;
}
.link-btn:hover{background:#eef0ff}
.rtabs{display:flex;gap:8px;margin:4px 0 14px}
.rtab{
  flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:13.5px;
  background:#f3f4f8;color:var(--muted);border:1.5px solid var(--line);transition:background .15s,color .15s;
}
.rtab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:12px;background:var(--grad);color:#fff;
  box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .1s,filter .15s;
}
.btn-icon:active{transform:scale(.93)}
.btn-icon.ghost{background:#eef0ff;color:var(--brand);box-shadow:none;border:1.5px solid var(--line)}
.btn-icon.danger{background:#ffe4ea;color:var(--danger);box-shadow:none}
.btn-icon.sm{width:38px;height:38px;border-radius:10px}
.btn-icon.sm svg{width:18px;height:18px}

/* ---------- App layout ---------- */
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;min-height:64px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand-ico{
  width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.brand-ico svg{width:22px;height:22px}
.nav{display:flex;gap:6px;flex:1;justify-content:center}
.nav button{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
  color:var(--muted);font-weight:700;font-size:14px;transition:background .15s,color .15s;
}
.nav button svg{width:19px;height:19px}
.nav button:hover{background:#eef0ff;color:var(--brand)}
.nav button.active{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.userbox{display:flex;align-items:center;gap:8px}
.uname{font-weight:700;font-size:14px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  background:#eef0ff;color:var(--brand);font-size:11.5px;font-weight:800;
  padding:4px 10px;border-radius:999px;
}
.badge.admin{background:#fef3c7;color:#b45309}

.main{max-width:1000px;margin:0 auto;padding:22px 18px 110px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{
  background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);
  border:1px solid var(--line);position:relative;overflow:hidden;
}
.stat::before{content:"";position:absolute;top:0;right:0;width:5px;height:100%;background:var(--grad)}
.stat .v{font-size:28px;font-weight:800;line-height:1.2}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px;font-weight:600}

/* ---------- Section ---------- */
.section{margin-bottom:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-head h2{margin:0;font-size:17px}

/* ---------- Drive cards ---------- */
.dlist{display:flex;flex-direction:column;gap:10px}
.dcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
}
.dcard-main{flex:1;min-width:0}
.dcard-main h3{margin:0 0 3px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard-main p{margin:0 0 6px;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.dcard-meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand2)}
.empty{
  background:var(--card);border:2px dashed var(--line);border-radius:var(--r);
  padding:34px 18px;text-align:center;color:var(--muted);font-size:14.5px;
}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{
  flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;
}
.toolbar .search svg{color:var(--muted);width:19px;height:19px}
.toolbar .search input{border:none;background:none;outline:none;padding:12px 0;flex:1}
.toolbar select{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;
}

/* ---------- Workers ---------- */
.wrow{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
}
.avatar{
  width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none;
}
.wrow.off .avatar{background:#c9cddc;color:#7d8299}
.wrow.off .winfo b{color:var(--muted);text-decoration:line-through}
.winfo{flex:1;min-width:0}
.winfo b{display:block;font-size:15.5px}
.winfo small{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.5px}
.wact{display:flex;gap:6px}

/* ---------- Settings ---------- */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
}
.panel h3{margin:0 0 6px;font-size:15.5px}
.panel p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.6}
.panel .row{display:flex;gap:10px;flex-wrap:wrap}
.info-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.info-line:last-child{border-bottom:none}
.info-line b{font-weight:700}

/* ---------- FAB ---------- */
.fab{
  position:fixed;left:20px;bottom:20px;width:58px;height:58px;border-radius:50%;
  background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 30px rgba(79,70,229,.4);z-index:40;transition:transform .12s;
}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}

/* ---------- Sheet / Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(18,20,35,.5);backdrop-filter:blur(3px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
}
.sheet{
  background:var(--card);border-radius:22px;box-shadow:var(--shadow-lg);
  width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:22px;
  animation:sheetIn .22s ease;
}
@keyframes sheetIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:18px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1}

/* ---------- OCR box ---------- */
.ocr\boxed{
  border:1.5px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:14px;background:#fbfbfe;
}
.ocrbox img{width:100%;max-height:180px;object-fit:contain;border-radius:10px;background:#eceef7;margin-bottom:10px}
.ocr-status{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .2s}
.ocr-lines{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
.ocr-lines button{
  text-align:right;padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);
  background:#fff;font-size:13.5px;transition:border-color .15s,background .15s;
}
.ocr-lines button:hover{border-color:var(--brand);background:#eef0ff}

/* ---------- Bon (credit slip) ---------- */
.thumb{
  width:58px;height:58px;border-radius:12px;object-fit:cover;
  background:#eceef7;flex:none;cursor:pointer;border:1px solid var(--line);
}
.empty-thumb{display:flex;align-items:center;justify-content:center;color:#a3a8c0}
.empty-thumb svg{width:24px;height:24px}
.amount{color:var(--brand);font-weight:800;white-space:nowrap}
.st{
  display:inline-block;font-size:11.5px;font-weight:800;
  padding:3px 10px;border-radius:999px;margin-top:6px;
}
.st.pending{background:#fef3c7;color:#b45309}
.st.sent{background:#dcfce7;color:#15803d}
.photo-preview{
  width:100%;max-height:220px;object-fit:contain;border-radius:12px;
  background:#eceef7;margin-top:10px;border:1px solid var(--line);
}
.fullphoto{
  width:100%;max-height:50vh;object-fit:contain;border-radius:14px;
  background:#eceef7;margin-bottom:14px;
}
.codebox{
  background:#0f1222;color:#d7dcff;border-radius:12px;padding:14px;
  font-size:12px;direction:ltr;text-align:left;max-height:280px;overflow:auto;
  font-family:Consolas,"Courier New",monospace;white-space:pre;user-select:all;
}
ol.steps{margin:0 0 14px;padding-right:20px;color:var(--muted);font-size:13.5px;line-height:1.9}
ol.steps b{color:var(--ink)}

/* ---------- Mobile ---------- */
.nav button.nav-logout{display:none}
@media (max-width:860px){
  .topbar{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .brand-txt{display:none}
  .nav{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-around;gap:2px;
  }
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:6px 10px;min-width:64px}
  .nav button svg{width:21px;height:21px}
  .nav button.active{background:none;color:var(--brand);box-shadow:none}
  .nav button.nav-logout{display:inline-flex;color:var(--danger)}
  .userbox #logoutBtn{display:none}
  .main{padding:16px 14px calc(var(--nav-h) + 90px)}
  .fab{left:16px;bottom:calc(var(--nav-h) + 18px)}
  .uname{display:none}
  .overlay{padding:0;align-items:flex-end}
  .sheet{max-width:none;border-radius:22px 22px 0 0;max-height:90vh;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:bottomIn .25s ease}
  @keyframes bottomIn{from{transform:translateY(100%)}to{transform:none}}
}

</style>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<!-- ============ شاشة الدخول / إنشاء الحساب ============ -->
<section id="authView" class="auth">
  <div class="auth-blob b1"></div>
  <div class="auth-blob b2"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="10" height="18" rx="2"/><path d="M7 7h4"/><path d="M14 9h3l3 3v6a2 2 0 0 1-4 0"/><path d="M3 21h12"/>
      </svg>
    </div>
    <h1>بونات الكريدي</h1>
    <p class="sub">عمال محطة الوقود — صوّر البون، يروح للجوجل درايف. يخدم بلا إنترنت</p>

    <form id="loginForm" class="form">
      <div class="field">
        <label>الاسم</label>
        <input id="loginName" autocomplete="username" placeholder="اسم العامل" required>
      </div>
      <div class="field">
        <label>الكود</label>
        <input id="loginCode" type="password" inputmode="numeric" placeholder="••••" required>
      </div>
      <p id="loginError" class="form-error hidden"></p>
      <button class="btn primary block" type="submit">دخول</button>
      <button id="forgotBtn" class="link-btn" type="button">نسيت كلمة المرور؟</button>
      <button id="showSetup" class="link-btn hidden" type="button">إنشاء حساب المدير</button>
    </form>

    <form id="setupForm" class="form hidden">
      <div class="setup-title">إنشاء حساب المدير</div>
      <div class="field">
        <label>اسم المدير</label>
        <input id="setupName" placeholder="مثال: يوسف" required>
      </div>
      <div class="field">
        <label>الكود</label>
        <input id="setupCode" type="password" inputmode="numeric" placeholder="4 أرقام أو أكثر" required>
      </div>
      <div class="field">
        <label>تأكيد الكود</label>
        <input id="setupCode2" type="password" inputmode="numeric" placeholder="عاود الكود" required>
      </div>
      <div class="field">
        <label>السؤال السري (لاسترجاع الكود)</label>
        <input id="setupQuestion" placeholder="مثال: اسم أول مدير؟" required>
      </div>
      <div class="field">
        <label>الجواب السري</label>
        <input id="setupAnswer" placeholder="جوابك" required>
      </div>
      <p id="setupError" class="form-error hidden"></p>
      <button class="btn primary block" type="submit">إنشاء الحساب</button>
      <button id="backToLogin" class="link-btn" type="button">رجوع للدخول</button>
    </form>

    <form id="recoverForm" class="form hidden">
      <div class="setup-title">استرجاع كلمة المرور</div>
      <div class="field">
        <label>الاسم</label>
        <input id="recName" placeholder="اسمك" required>
      </div>

      <div class="rtabs">
        <button type="button" id="rtabQ" class="rtab active">السؤال السري</button>
        <button type="button" id="rtabT" class="rtab">كود الأدمن</button>
      </div>

      <div id="recSecQ">
        <div class="field">
          <label>السؤال السري</label>
          <input id="recQuestion" readonly placeholder="دخّل الاسم باش يبان السؤال">
        </div>
        <div class="field">
          <label>الجواب</label>
          <input id="recAnswer" placeholder="الجواب السري" required>
        </div>
      </div>

      <div id="recSecT" class="hidden">
        <p class="sub" style="margin:0 0 12px">تاصل بالأدمن، هو يولّدلك <b>كود مؤقت</b>، اكتبو هنا.</p>
        <div class="field">
          <label>الكود المؤقت</label>
          <input id="recToken" inputmode="numeric" placeholder="مثال: 482913">
        </div>
      </div>

      <div class="field">
        <label>كلمة المرور الجديدة</label>
        <input id="recCode" type="password" inputmode="numeric" placeholder="4 أرقام أو أكثر" required>
      </div>
      <div class="field">
        <label>تأكيد كلمة المرور</label>
        <input id="recCode2" type="password" inputmode="numeric" placeholder="عاود الكود" required>
      </div>
      <p id="recoverError" class="form-error hidden"></p>
      <button class="btn primary block" type="submit">تغيير كلمة المرور</button>
      <button id="recoverBack" class="link-btn" type="button">رجوع للدخول</button>
    </form>
  </div>
</section>

<!-- ============ التطبيق ============ -->
<div id="appView" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="10" height="18" rx="2"/><path d="M7 7h4"/><path d="M14 9h3l3 3v6a2 2 0 0 1-4 0"/><path d="M3 21h12"/>
        </svg>
      </span>
      <span class="brand-txt">البونات</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="userbox">
      <span id="userBadge" class="badge"></span>
      <span id="userName" class="uname"></span>
      <button id="logoutBtn" class="btn-icon ghost" title="خروج"></button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <button id="fab" class="fab" title="بون جديد"></button>
</div>

<!-- ============ نافذة منبثقة ============ -->
<div id="overlay" class="overlay hidden">
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
</div>

<input id="importFile" type="file" accept="application/json,.json" class="hidden">

<script>
"use strict";

const DB_NAME = "drives_db";
const DB_VERSION = 2;
let _db = null;

function dbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("users")) {
        db.createObjectStore("users", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("drives")) {
        const s = db.createObjectStore("drives", { keyPath: "id" });
        s.createIndex("workerId", "workerId");
        s.createIndex("date", "date");
      }
      if (!db.objectStoreNames.contains("bons")) {
        const s = db.createObjectStore("bons", { keyPath: "id" });
        s.createIndex("workerId", "workerId");
        s.createIndex("date", "date");
      }
      if (!db.objectStoreNames.contains("settings")) {
        db.createObjectStore("settings", { keyPath: "key" });
      }
    };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}

function dbAll(store) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store).objectStore(store).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}

function dbGet(store, key) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store).objectStore(store).get(key);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => rej(r.error);
  });
}

function dbPut(store, val) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store, "readwrite").objectStore(store).put(val);
    r.onsuccess = () => res(val);
    r.onerror = () => rej(r.error);
  });
}

function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store, "readwrite").objectStore(store).delete(key);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

function dbClear(store) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store, "readwrite").objectStore(store).clear();
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function makeCode(len) {
  const n = len || 5;
  let s = "";
  for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 10);
  return s;
}

async function hashText(str) {
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(str)));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 0;
  const s = String(str);
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return "f" + (h >>> 0).toString(16);
}

const APPS_SCRIPT_CODE = `function clean_(s) {
  return String(s || "autre").replace(/[\\\\\\/:*?"<>|]/g, "_").slice(0, 80) || "autre";
}

function child_(parent, name) {
  var it = parent.getFoldersByName(name);
  return it.hasNext() ? it.next() : parent.createFolder(name);
}

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function root_() {
  var rootName = "BONS-CREDIT";
  var it = DriveApp.getFoldersByName(rootName);
  return it.hasNext() ? it.next() : DriveApp.createFolder(rootName);
}

function folder_(data) {
  var root = root_();
  var month = clean_(data.month || "sans-mois");
  var day = clean_(data.day || "sans-jour");
  var worker = clean_(data.worker || "autre");
  return child_(child_(child_(root, month), day), worker);
}

function syncFile_() {
  var root = root_();
  var name = "sync.json";
  var it = root.getFilesByName(name);
  return it.hasNext() ? it.next() : root.createFile(name, "{}", MimeType.PLAIN_TEXT);
}

function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);

    if (data.action === "ping") return json_({ ok: true });

    if (data.action === "pull") {
      var f = syncFile_();
      return json_({ ok: true, data: JSON.parse(f.getBlob().getDataAsString() || "{}") });
    }

    if (data.action === "sync") {
      var sf = syncFile_();
      sf.setContent(JSON.stringify(data.data || {}));
      return json_({ ok: true, savedAt: new Date().getTime() });
    }

    var folder = folder_(data);
    var blob = Utilities.newBlob(
      Utilities.base64Decode(data.base64),
      data.mime || "image/jpeg",
      data.name
    );
    var file = folder.createFile(blob);
    return json_({ ok: true, id: file.getId(), url: file.getUrl() });
  } catch (err) {
    return json_({ ok: false, error: String(err) });
  }
}`;

const $ = (s) => document.querySelector(s);
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function normName(s) {
  return String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
}
function normAnswer(s) {
  return String(s || "").trim().replace(/\s+/g, " ").toLowerCase()
    .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDate(iso) {
  if (iso === null || iso === undefined || iso === "") return "";
  const s = String(iso);
  const parts = s.split("-");
  if (parts.length < 3) return s;
  const [y, m, d] = parts;
  return `${d}/${m}/${y}`;
}
function fmtDateTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function monthKey(iso) { return (iso || "").slice(0, 7); }
function fmtAmt(n) { return (Number(n) || 0).toLocaleString("fr-FR"); }
function parseAmt(v) {
  const x = parseFloat(String(v || "").replace(/[^\d.,-]/g, "").replace(",", "."));
  return isNaN(x) ? 0 : x;
}
function toast(msg, type, ms) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast" + (type ? " " + type : "");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.add("hidden"), ms || 2600);
}

async function init() {
  if (location.protocol === "file:") {
    toast("شغّل التطبيق عبر start.bat باش يخدم بشكل كامل", "err");
  }
  try { await dbOpen(); } catch (e) {
    document.body.innerHTML = "<p style='text-align:center;margin-top:40px'>ما قدرنا نفتحو قاعدة البيانات فهاد المتصفح.</p>";
    return;
  }
  await refreshData();

  const saved = localStorage.getItem("uid");
  const su = saved && S.users.find(u => u.id === saved && u.active);
  if (su) { await enterApp(su); return; }

  if (S.users.length) showLogin();
  else showSetup();

  if (S.driveUrl && navigator.onLine) setTimeout(() => cloudPullOnly(), 800);

  setTimeout(() => {
    if (!S.booted) {
      showSetup();
      if (_bootErr) toast("كاين مشكل فالتطبيق: " + _bootErr, "err", 10000);
    }
  }, 4000);
}

$("#recoverForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("#recoverError");
  err.classList.add("hidden");
  const name = normName($("#recName").value);
  const code = $("#recCode").value.trim();
  const code2 = $("#recCode2").value.trim();
  let u = S.users.find(x => normName(x.name) === name);
  if (!u && S.driveUrl && navigator.onLine) {
    await cloudPullOnly(true);
    u = S.users.find(x => normName(x.name) === name);
  }
  if (!u) { err.textContent = "ما لقينا حتى حساب بهاد الاسم"; err.classList.remove("hidden"); return; }
  if (!u.active) { err.textContent = "هاد الحساب موقوف، تاصل بالأدمن"; err.classList.remove("hidden"); return; }

  if (_recTab === "q") {
    const answer = $("#recAnswer").value.trim();
    if (!u.question || !u.answerHash) {
      err.textContent = "هاد الحساب ما عندو سؤال سري. استعمل خيار كود الأدمن";
      err.classList.remove("hidden"); return;
    }
    if (await hashText(normAnswer(answer)) !== u.answerHash) {
      err.textContent = "الجواب السري غالط"; err.classList.remove("hidden"); return;
    }
  } else {
    const token = $("#recToken").value.trim();
    if (!u.tempTokenHash) { err.textContent = "ما كاين حتى كود مؤقت. قول للأدمن يولّدلك واحد"; err.classList.remove("hidden"); return; }
    if (!u.tempTokenExp || Date.now() > u.tempTokenExp) { err.textContent = "الكود المؤقت فات وقته. قول للأدمن يولّد واحد جديد"; err.classList.remove("hidden"); return; }
    if (await hashText(token) !== u.tempTokenHash) { err.textContent = "الكود المؤقت غالط"; err.classList.remove("hidden"); return; }
  }

  if (code.length < 4) { err.textContent = "الكود خاصو 4 أرقام على الأقل"; err.classList.remove("hidden"); return; }
  if (code !== code2) { err.textContent = "الكودين ما تطابقوش"; err.classList.remove("hidden"); return; }
  u.codeHash = await hashText(code);
  u.tempTokenHash = "";
  u.tempTokenExp = 0;
  await dbPut("users", u);
  await refreshData();
  $("#recoverForm").reset();
  $("#loginName").value = u.name;
  toast("تبدل الكود — دخل دابا", "ok");
  showLogin();
});

async function compressImage(file, maxW, quality) {
  const w = maxW || 1280;
  const q = quality || 0.72;
  let bitmap = null;
  try { bitmap = await createImageBitmap(file); } catch (e) { /* fallback below */ }
  let iw, ih, draw;
  if (bitmap) {
    iw = bitmap.width; ih = bitmap.height;
  } else {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = url;
    });
    iw = img.width; ih = img.height;
    draw = img;
  }
  const scale = Math.min(1, w / Math.max(iw, ih));
  const cw = Math.round(iw * scale), ch = Math.round(ih * scale);
  const canvas = document.createElement("canvas");
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(bitmap || draw, 0, 0, cw, ch);
  if (bitmap) bitmap.close();
  return await new Promise((res) => canvas.toBlob((b) => res(b), "image/jpeg", q));
}

async function photoHash(blob) {
  let src = null, revoke = null;
  try { src = await createImageBitmap(blob); } catch (e) {
    revoke = URL.createObjectURL(blob);
    src = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = revoke;
    });
  }
  const c = document.createElement("canvas");
  c.width = 16; c.height = 16;
  const g = c.getContext("2d");
  g.drawImage(src, 0, 0, 16, 16);
  if (src.close) src.close();
  if (revoke) URL.revokeObjectURL(revoke);
  const d = g.getImageData(0, 0, 16, 16).data;
  const gray = [];
  for (let i = 0; i < d.length; i += 4) gray.push(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
  const mean = gray.reduce((a, b) => a + b, 0) / gray.length;
  let bits = "";
  for (const v of gray) bits += v >= mean ? "1" : "0";
  return bits;
}

function hamming(a, b) {
  if (!a || !b || a.length !== b.length) return 999;
  let n = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) n++;
  return n;
}

function findDuplicate(client, amount, date, workerId, hash, excludeId) {
  if (hash) {
    const sim = S.items.find(d => d.id !== excludeId && d.photoHash && hamming(d.photoHash, hash) <= 6);
    if (sim) return { type: "photo", item: sim };
  }
  return null;
}

function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = res;
    s.onerror = () => rej(new Error("تعذر تحميل محرك القراءة"));
    document.head.appendChild(s);
  });
}

function lineLetters(l) { return (l.match(/\p{L}/gu) || []).length; }
function lineDigits(l) { return (l.match(/\d/g) || []).length; }

function parseDateStr(l) {
  const m = String(l).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return null;
  let d = parseInt(m[1], 10), mo = parseInt(m[2], 10);
  let y = m[3];
  if (y.length === 2) y = "20" + y;
  if (d > 31 && mo <= 12) { const t = d; d = mo; mo = t; } // ي/m/d إذا الأول كبير
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function parseAmountStr(l) {
  const cleaned = String(l).replace(/\s/g, "");
  const m = cleaned.match(/(\d+(?:[.,]\d{1,2})?)/);
  return m ? m[1].replace(",", ".") : "";
}

function afterLabel(l, re) {
  const parts = String(l).split(/[:：]/);
  if (parts.length > 1 && parts[1].trim()) return parts[1].trim();
  return String(l).replace(re, "").replace(/[:：]/g, "").trim();
}

const AMOUNT_HINT = /دج|درهم|dinar|montant|total|\bdh\b|\bda\b|\bdt\b|\.00\b/i;
const AGENT_HINT = /عامل|العامل|agent|vendeur|مشرف|بون\s*[:：]/i;
const CLIENT_HINT = /شركة|زبون|عميل|client|soci[ée]t[ée]|nom\s*client/i;
const CLIENT_RE = /شركة|زبون|عميل|client|soci[ée]t[ée]|nom\s*client/gi;
const AGENT_RE = /عامل|العامل|agent|vendeur|مشرف/gi;

function isAgentLine(l) {
  const t = String(l).replace(/زبون/g, "ز-بون");
  return AGENT_HINT.test(t);
}

function isAmountLine(l) {
  return AMOUNT_HINT.test(l) || (lineDigits(l) >= 3 && lineDigits(l) > lineLetters(l));
}

function clientValue(l) {
  if (CLIENT_HINT.test(l) && /[:：]/.test(l)) {
    const v = afterLabel(l, CLIENT_RE);
    if (v && lineLetters(v) > 1) return v;
  }
  return String(l).replace(/[:：]$/, "").trim();
}

function setVal(sel, v) {
  const el = $(sel);
  if (el) el.value = v;
  return !!el;
}
function getVal(sel) {
  const el = $(sel);
  return el ? el.value : "";
}

function assignLine(l) {
  const ds = parseDateStr(l);
  if (ds) { if (setVal("#bDate", ds)) { toast("تم تعويض التاريخ", "ok"); return; } }
  if (isAmountLine(l)) {
    const a = parseAmountStr(l);
    if (a) { $("#bAmount").value = a; toast("تم تعويض المبلغ", "ok"); return; }
  }
  if (isAgentLine(l)) {
    const v = afterLabel(l, AGENT_RE);
    if (v && lineLetters(v) > 1 && setVal("#bAgent", v)) { toast("تم تعويض اسم العامل", "ok"); return; }
  }
  if (lineLetters(l) > 1) {
    $("#bClient").value = clientValue(l);
    toast("تم تعويض اسم الشركة", "ok");
    return;
  }
}

async function runOCR(file) {
  const box = $("#ocrBox");
  box.classList.remove("hidden");
  const st = $("#ocrStatus");
  const bar = $("#ocrBar");
  const linesBox = $("#ocrLines");
  linesBox.innerHTML = "";
  bar.style.width = "0%";
  st.textContent = "جاري التحميل...";
  try {
    await loadTesseract();
    st.textContent = "جاري تجهيز محرك القراءة...";
    const worker = await Tesseract.createWorker(["ara", "eng"], 1, {
      logger: (m) => {
        if (m.status === "recognizing text") {
          st.textContent = "جاري قراءة الورقة...";
          bar.style.width = Math.round((m.progress || 0) * 100) + "%";
        }
      }
    });
    st.textContent = "جاري قراءة الورقة...";
    const { data } = await worker.recognize(file);
    await worker.terminate();
    bar.style.width = "100%";
    const lines = String(data.text || "").split(/\n+/).map(s => s.trim()).filter(s => s.length > 1);
    if (!lines.length) { st.textContent = "ما قدرنا نقرو والو، عبّي يدويا"; return; }

    // ---- التاريخ (ما نبدلوش إذا العامل بدلو باليد) ----
    const curDate = getVal("#bDate");
    const dateHit = lines.map(l => ({ l, d: parseDateStr(l) })).find(x => x.d);
    if (dateHit && (!curDate || curDate === todayISO())) setVal("#bDate", dateHit.d);

    // ---- المبلغ (ما نعمرش فوق حاجة مكتوبة باليد) ----
    const curAmount = $("#bAmount").value.trim();
    const amountHit = lines.filter(l => isAmountLine(l) && !(dateHit && l === dateHit.l))
      .sort((a, b) => (AMOUNT_HINT.test(b) ? 1 : 0) - (AMOUNT_HINT.test(a) ? 1 : 0) || lineDigits(b) - lineDigits(a))[0];
    const amountVal = amountHit ? parseAmountStr(amountHit) : "";
    if (amountVal && !curAmount) $("#bAmount").value = amountVal;

    // ---- اسم العامل (غير إلا كان الحقل موجود، ماشي للعامل) ----
    const hasAgentField = !!$("#bAgent");
    const agentHit = hasAgentField
      ? lines.filter(l => isAgentLine(l) && !(dateHit && l === dateHit.l) && l !== amountHit)
          .sort((a, b) => lineLetters(b) - lineLetters(a))[0]
      : null;
    if (agentHit) {
      const v = afterLabel(agentHit, AGENT_RE);
      if (v && lineLetters(v) > 1) $("#bAgent").value = v;
    }

    // ---- اسم الشركة (ما نعمرش فوق حاجة مكتوبة باليد) ----
    const curClient = $("#bClient").value.trim();
    const skip = new Set([dateHit && dateHit.l, amountHit, hasAgentField && agentHit].filter(Boolean));
    const clientHit = lines.filter(l => !skip.has(l) && lineLetters(l) > 2 && !isAmountLine(l))
      .sort((a, b) => {
        const ha = CLIENT_HINT.test(a) ? 1 : 0, hb = CLIENT_HINT.test(b) ? 1 : 0;
        return hb - ha || b.length - a.length;
      })[0];
    if (clientHit && !curClient) $("#bClient").value = clientValue(clientHit);

    const found = [];
    if (clientHit) found.push("الشركة");
    if (amountVal) found.push("المبلغ");
    if (agentHit && $("#bAgent")) found.push("العامل");
    if (dateHit && $("#bDate")) found.push("التاريخ");
    st.textContent = found.length
      ? `لقينا: ${found.join("، ")} — تأكد و عدّل إذا حاجة غالطة`
      : "ما عرفنا والو بضبط — اضغط على السطر المناسب باش تعويض";

    linesBox.innerHTML = lines.map(l => `<button type="button" data-line="${esc(l)}">${esc(l)}</button>`).join("");
    linesBox.querySelectorAll("[data-line]").forEach(b => b.onclick = () => assignLine(b.dataset.line));
  } catch (e) {
    st.textContent = "تعذّرت القراءة (يمكن بلا إنترنت) — عبّي يدويا";
  }
}

/* ================= الإرسال لـ Google Drive ================= */
function toBase64(blob) {
  return blob.arrayBuffer().then((buf) => {
    const bytes = new Uint8Array(buf);
    let bin = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  });
}
function slugName(s) {
  return String(s || "bon").replace(/[^\p{L}\d]+/gu, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "bon";
}
function capSlug(s) {
  return String(s || "autre").replace(/[^\p{L}\d]+/gu, "-").replace(/^-+|-+$/g, "").toUpperCase().slice(0, 30) || "autre";
}
function dhDate(iso) {
  return String(iso || todayISO()).replace(/[^\d]/g, "").slice(0, 8);
}
function bonFileName(item) {
  return `${slugName(item.client || "bon")}_${capSlug(item.workerName || userName(item.workerId))}_${item.amount || 0}dh_${dhDate(item.date)}.jpg`;
}

async function sendOne(item) {
  if (!S.driveUrl) {
    if (S.user.role === "admin") toast("ما كاين حتى رابط Google Drive — راجع الإعدادات", "err");
    else toast("الأدمن خاصو يدخل رابط Google Drive", "err");
    return false;
  }
  if (!item.photo) return false;
  try {
    const base64 = await toBase64(item.photo);
    const day = item.date || todayISO();
    const res = await fetch(S.driveUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "upload",
        name: bonFileName(item),
        base64,
        mime: "image/jpeg",
        month: day.slice(0, 7),
        day: day,
        worker: capSlug(item.workerName || userName(item.workerId))
      })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "خطأ فالسيرفر");
    item.status = "sent";
    item.sentAt = Date.now();
    item.driveFileId = data.id || "";
    await dbPut("bons", item);
    await refreshData();
    return true;
  } catch (e) {
    toast("تعذر الإرسال: " + (e.message || "بلا إنترنت"), "err");
    return false;
  }
}

async function flushQueue(silent) {
  const pend = pendingItems();
  if (!pend.length) { if (!silent) toast("ما كاين حتى بون معلق", "ok"); return; }
  if (!S.driveUrl) { if (!silent) toast("دخل رابط Google Drive فالإعدادات أولا", "err"); return; }
  if (!silent) toast(`جاري إرسال ${pend.length} بون...`);
  let ok = 0;
  for (const item of sortedItems(pend)) {
    if (await sendOne(item)) ok++;
  }
  go(S.tab);
  if (ok) toast(`تم إرسال ${ok} بون للDrive`, "ok");
}

/* ================= تصدير Excel (.xlsx بدون مكتبات) ================= */
let _crcT = null;
function crcTable() {
  if (_crcT) return _crcT;
  _crcT = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    _crcT[n] = c >>> 0;
  }
  return _crcT;
}
function crc32(u8) {
  const t = crcTable();
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = t[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = (s) => new TextEncoder().encode(s);
  const parts = [], central = [];
  let offset = 0;
  const DOS_TIME = 0, DOS_DATE = 23585;
  for (const f of files) {
    const nameU8 = enc(f.n);
    const crc = crc32(f.d);
    const lh = new Uint8Array(30 + nameU8.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, DOS_TIME, true);
    dv.setUint16(12, DOS_DATE, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, f.d.length, true);
    dv.setUint32(22, f.d.length, true);
    dv.setUint16(26, nameU8.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameU8, 30);
    parts.push(lh, f.d);
    const ch = new Uint8Array(46 + nameU8.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, DOS_TIME, true);
    cv.setUint16(14, DOS_DATE, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, f.d.length, true);
    cv.setUint32(24, f.d.length, true);
    cv.setUint16(28, nameU8.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nameU8, 46);
    central.push(ch);
    offset += lh.length + f.d.length;
  }
  let cdSize = 0;
  central.forEach((c) => { cdSize += c.length; });
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  const all = parts.concat(central, [eocd]);
  let total = 0;
  all.forEach((a) => { total += a.length; });
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach((a) => { out.set(a, p); p += a.length; });
  return out;
}
function colRef(i) {
  let s = "";
  i++;
  while (i > 0) {
    const m = (i - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}
function xmlEsc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
}
function sheetXml(rows) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row, ri) => {
    x += `<row r="${ri + 1}">`;
    row.forEach((val, ci) => {
      if (val === null || val === undefined || val === "") return;
      const ref = colRef(ci) + (ri + 1);
      if (typeof val === "number" && isFinite(val)) {
        x += `<c r="${ref}"><v>${val}</v></c>`;
      } else {
        x += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
      }
    });
    x += "</row>";
  });
  return x + "</sheetData></worksheet>";
}
function saveXlsx(filename, rows, sheetName) {
  const enc = (s) => new TextEncoder().encode(s);
  const CT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    "</Types>";
  const RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    "</Relationships>";
  const WB = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    `<sheets><sheet name="${xmlEsc(sheetName || "بيانات")}" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const WBRELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    "</Relationships>";
  const zip = zipStore([
    { n: "[Content_Types].xml", d: enc(CT) },
    { n: "_rels/.rels", d: enc(RELS) },
    { n: "xl/workbook.xml", d: enc(WB) },
    { n: "xl/_rels/workbook.xml.rels", d: enc(WBRELS) },
    { n: "xl/worksheets/sheet1.xml", d: enc(sheetXml(rows)) }
  ]);
  const blob = new Blob([zip], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

  });

function clientsAgg() {
  const map = new Map();
  S.items.forEach((d) => {
    const k = normName(d.client);
    if (!k) return;
    if (!map.has(k)) map.set(k, { name: d.client, n: 0, amt: 0, first: d.date, last: d.date });
    const c = map.get(k);
    c.n++;
    c.amt += Number(d.amount) || 0;
    if (d.date < c.first) c.first = d.date;
    if (d.date > c.last) c.last = d.date;
  });
  return [...map.values()].sort((a, b) => b.amt - a.amt);
}

function exportClientsExcel() {
  const rows = [["الزبون", "عدد البونات", "المجموع (دج)", "أول بون", "آخر بون"]];
  clientsAgg().forEach((c) => rows.push([c.name, c.n, c.amt, fmtDate(c.first), fmtDate(c.last)]));
  if (rows.length === 1) rows.push(["—", 0, 0, "", ""]);
  saveXlsx("الزبناء-" + todayISO() + ".xlsx", rows, "الزبناء");
  toast("تم تحميل ملف الزبناء", "ok");
}

function statusLabel(d) { return d.status === "sent" ? "مرسل" : "قيد الإرسال"; }

function exportWorkersBonsExcel() {
  const rows = [["التاريخ", "العامل", "الزبون", "المبلغ (دج)", "اسم العامل فالبون", "ملاحظات", "الحالة"]];
  const workers = S.users.filter((u) => u.role !== "admin");
  workers.forEach((u) => {
    sortedItems(S.items.filter((d) => d.workerId === u.id)).forEach((d) => {
      rows.push([fmtDate(d.date), u.name, d.client || "", Number(d.amount) || 0, d.agentName || "", d.notes || "", statusLabel(d)]);
    });
  });
  if (rows.length === 1) rows.push(["—", "—", "—", 0, "", "", ""]);
  saveXlsx("بونات-العمال-" + todayISO() + ".xlsx", rows, "بونات العمال");
  toast("تم تحميل بونات العمال", "ok");
}

function exportClientsBonsExcel() {
  const rows = [["التاريخ", "الزبون", "العامل", "المبلغ (دج)", "اسم العامل فالبون", "ملاحظات", "الحالة"]];
  [...S.items].sort((a, b) => normName(a.client).localeCompare(normName(b.client)) || (b.createdAt || 0) - (a.createdAt || 0))
    .forEach((d) => {
      rows.push([fmtDate(d.date), d.client || "", userName(d.workerId), Number(d.amount) || 0, d.agentName || "", d.notes || "", statusLabel(d)]);
    });
  if (rows.length === 1) rows.push(["—", "—", "—", 0, "", "", ""]);
  saveXlsx("بونات-الزبناء-" + todayISO() + ".xlsx", rows, "بونات الزبناء");
  toast("تم تحميل بونات الزبناء", "ok");
}

/* ================= تصدير / استيراد ================= */
function exportJSON() {
  const payload = {
    app: "bons-credit",
    version: 2,
    exportedAt: new Date().toISOString(),
    users: S.users,
    bons: S.items.map(({ photo, ...rest }) => rest)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bons-backup-" + todayISO() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("تم تصدير النسخة", "ok");
}

function cloudPayload() {
  return {
    app: "bons-credit",
    version: 2,
    updatedAt: Date.now(),
    users: S.users,
    bons: S.items.map(({ photo, ...rest }) => rest)
  };
}

async function cloudRequest(action, extra) {
  if (!S.driveUrl) throw new Error("ما كاين حتى رابط Drive فالإعدادات");
  const res = await fetch(S.driveUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action }, extra || {}))
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "خطأ فالسيرفر");
  return data;
}

async function mergeRemote(remote) {
  const ver = (x) => x.editedAt || x.createdAt || x.sentAt || x.lastSeen || 0;
  let n = 0;
  for (const ru of remote.users || []) {
    if (!ru || !ru.id) continue;
    const local = S.users.find(x => x.id === ru.id);
    if (!local) { await dbPut("users", ru); n++; }
    else if (ver(ru) > ver(local) && ru.id !== (S.user && S.user.id)) {
      await dbPut("users", Object.assign({}, local, ru));
      n++;
    }
  }
  for (const rd of remote.bons || []) {
    if (!rd || !rd.id) continue;
    const local = S.items.find(x => x.id === rd.id);
    if (!local) { await dbPut("bons", Object.assign({ photo: null }, rd)); n++; }
    else if (ver(rd) > ver(local)) {
      await dbPut("bons", Object.assign({}, local, rd, { photo: local.photo }));
      n++;
    }
  }
  return n;
}

let _syncing = false;
async function cloudPullOnly(force) {
  if (!S.driveUrl || !navigator.onLine) return 0;
  if (_syncing && !force) return 0;
  _syncing = true;
  try {
    const pull = await cloudRequest("pull");
    const added = await mergeRemote(pull.data || {});
    if (added) {
      await refreshData();
      if (!S.user) {
        if (S.users.length) showLogin();
      } else {
        go(S.tab);
      }
    }
    return added;
  } catch (e) { return 0; }
  finally { _syncing = false; }
}
async function cloudSync(silent) {
  if (_syncing) return;
  if (!S.driveUrl) { if (!silent) toast("زيد رابط Google Drive فالإعدادات", "err"); return; }
  if (!navigator.onLine) { if (!silent) toast("ما كاينش إنترنت دابا", "err"); return; }
  _syncing = true;
  try {
    const pull = await cloudRequest("pull");
    const added = mergeRemote(pull.data || {});
    if (added) await refreshData();
    await cloudRequest("sync", { data: cloudPayload() });
    S.lastSync = Date.now();
    await dbPut("settings", { key: "lastSync", value: S.lastSync });
    const lt = $("#lastSyncTxt");
    if (lt) lt.textContent = fmtDateTime(S.lastSync);
    if (S.tab) go(S.tab);
    if (!silent || added) toast(added ? `تمت المزامنة — ${added} جديد` : "كلشي محدّث", "ok");
  } catch (e) {
    if (!silent) toast("تعذّرت المزامنة: " + e.message, "err");
  } finally {
    _syncing = false;
  }
}

async function importJSON(file) {
  try {
    const data = JSON.parse(await file.text());
    let n = 0;
    for (const u of data.users || []) {
      if (u && u.id && !S.users.some(x => x.id === u.id)) { await dbPut("users", u); n++; }
    }
    for (const d of data.bons || data.drives || []) {
      if (d && d.id && !S.items.some(x => x.id === d.id)) {
        d.photo = null;
        await dbPut("bons", d);
        n++;
      }
    }
    await refreshData();
    go(S.tab);
    toast(n ? `تمت المزامنة: ${n} عنصر جديد` : "ما كاين حتى حاجة جديدة", n ? "ok" : "");
    if (n && S.driveUrl && navigator.onLine) cloudSync(true);
  } catch (e) {
    toast("الملف غالط", "err");
  }
}
